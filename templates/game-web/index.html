<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <title>fluidblend web test bed</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1a1a1f; color: #e8e8ea; font: 14px system-ui, sans-serif; }
      canvas { display: block; width: 100vw; height: 100vh; }

    </script>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="hud">loading…</div>
    <pre id="fluidblend-report"></pre>
    <script type="module" src="./src/main.js"></script>
  </body>
